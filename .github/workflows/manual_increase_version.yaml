# This is a basic workflow to help you get started with Actions

name: Increase version

on:
  workflow_dispatch:
    inputs:
      level:
        description: "Version level to increase (major, minor or patch)"
        required: true
        default: "patch"
        type: choice
        options:
          - patch
          - minor
          - major


permissions:
  pull-requests: write
  contents: write
  
jobs:
  increase_version:
    uses: ./.github/workflows/common_push_version.yaml
    with:
      level: ${{ inputs.level }}
      ref: ${{ github.ref }}
    secrets:
      ACTIONS_GITHUB_TOKEN_PULL_REQUEST: ${{ secrets.ACTIONS_GITHUB_TOKEN_PULL_REQUEST }}